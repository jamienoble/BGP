# Directus: the staff-facing editor for Walkies content and moderation.
# It connects straight to the Supabase Postgres database and stores
# uploaded images in a Supabase Storage bucket.
#
# Local trial:   cp .env.example .env  (fill it in)  &&  docker compose up
# Production:    deploy the same image + environment variables to a host
#                such as Railway, Render or Fly.io (see README.md).
services:
  directus:
    image: directus/directus:11
    ports:
      - "8055:8055"
    env_file: .env
    restart: unless-stopped
